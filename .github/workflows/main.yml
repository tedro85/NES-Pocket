name: Build NES Pocket APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Unzip NES Pocket
        run: unzip -o NESPocket-source.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fix LibretroDroid version
        working-directory: NESPocket
        run: |
          sed -i 's/com.github.Swordfish90:LibretroDroid:0.13.2/com.github.Swordfish90:LibretroDroid:0.14.0/' app/build.gradle.kts
          grep LibretroDroid app/build.gradle.kts

      - name: Build APK
        working-directory: NESPocket
        run: gradle assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NES-Pocket-APK
          path: NESPocket/app/build/outputs/apk/debug/app-debug.apk
